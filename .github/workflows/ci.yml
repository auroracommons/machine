name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy matplotlib
      - name: Gradient checks and training smoke test
        run: python -m unittest discover -s tests -v
      - name: Short training run (30 steps)
        run: python scripts/train_char_lm.py --steps 30 --eval-every 30 --out /tmp/ci_run.json
